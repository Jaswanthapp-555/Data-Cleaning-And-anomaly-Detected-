services:
  - type: web
    name: clean-core-profiler
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "backend.app:create_app()" --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
